name: Build
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name of the game (optional if using /data/local/tmp/il2cppdumper/package.txt):"
        required: false
        default: ""
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        cache: gradle

    - name: Configure Target Package
      run: |
        PKG="${{ github.event.inputs.package_name }}"
        if [ -n "$PKG" ] && [ "$PKG" != "com.game.packagename" ]; then
          sed -i "s/moduleDescription = \"/moduleDescription = \"($PKG) /g" module.gradle
          sed -i "s/com.game.packagename/$PKG/g" module/src/main/cpp/game.h
        fi

    - name: Build with Gradle
      run: |
        chmod +x ./gradlew
        ./gradlew :module:assembleRelease

    - name: Upload Module Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zygisk-il2cppdumper
        path: |
          out/*.zip
          out/magisk_module_release/

